{{- range $name, $c := .Values.components }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ $.Release.Name }}-{{ $name }}, labels: {{- include "rip.labels" $ | nindent 4 }} }
spec:
  replicas: {{ $c.replicas }}
  selector: { matchLabels: { app: {{ $.Release.Name }}-{{ $name }} } }
  template:
    metadata:
      labels: { app: {{ $.Release.Name }}-{{ $name }} }
      annotations: { checksum/config: {{ toJson $.Values.config | sha256sum }} }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: {{ $name }}
          image: {{ $.Values.image.registry }}/rip-{{ $name }}:{{ $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports: [{ containerPort: {{ $c.port }}, name: http }]
          {{- if ne $name "web" }}
          envFrom: [{ configMapRef: { name: {{ $.Release.Name }}-config } }, { secretRef: { name: {{ $.Values.existingSecret }} } }]
          {{- end }}
          resources: { requests: { cpu: {{ $c.cpu }}, memory: {{ $c.memory }} } }
          readinessProbe: { httpGet: { path: {{ $c.ready }}, port: http } }
          livenessProbe: { httpGet: { path: {{ $c.health }}, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: {{ $.Release.Name }}-{{ $name }} }
spec: { selector: { app: {{ $.Release.Name }}-{{ $name }} }, ports: [{ port: {{ $c.port }}, targetPort: http }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: {{ $.Release.Name }}-{{ $name }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ $.Release.Name }}-{{ $name }} }
  minReplicas: {{ $c.replicas }}
  maxReplicas: {{ $c.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
{{- end }}
