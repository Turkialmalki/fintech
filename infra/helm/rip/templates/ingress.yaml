apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  annotations: { cert-manager.io/cluster-issuer: letsencrypt, nginx.ingress.kubernetes.io/proxy-body-size: 25m }
spec:
  ingressClassName: nginx
  tls: [{ hosts: [{{ .Values.host }}], secretName: {{ .Release.Name }}-tls }]
  rules:
    - host: {{ .Values.host }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { number: 3000 } } } }] }
