apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations: { "helm.sh/hook": pre-install,pre-upgrade, "helm.sh/hook-delete-policy": before-hook-creation }
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: migrate
          image: {{ .Values.image.registry }}/rip-api:{{ .Values.image.tag }}
          command: ["alembic", "upgrade", "head"]
          envFrom: [{ secretRef: { name: {{ .Values.existingSecret }} } }]
