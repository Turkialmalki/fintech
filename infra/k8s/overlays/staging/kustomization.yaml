apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
namespace: rip-staging
patches:
  - target: { kind: ConfigMap, name: rip-config }
    patch: |
      - { op: replace, path: /data/ENVIRONMENT, value: staging }
      - { op: replace, path: /data/CORS_ORIGINS, value: https://staging.rip.example.com }
  - target: { kind: Deployment }
    patch: |
      - { op: replace, path: /spec/replicas, value: 1 }
