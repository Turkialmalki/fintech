# Default deny; only the paths the architecture needs are opened.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny }
spec: { podSelector: {}, policyTypes: [Ingress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: api-from-web-and-ingress }
spec:
  podSelector: { matchLabels: { app: rip-api } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: rip-web } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mcp-from-api-and-ingress }
spec:
  podSelector: { matchLabels: { app: rip-mcp } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: rip-api } } }, { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: web-from-ingress }
spec:
  podSelector: { matchLabels: { app: rip-web } }
  ingress: [{ from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ingress-nginx } } }] }]
