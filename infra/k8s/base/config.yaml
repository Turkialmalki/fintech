apiVersion: v1
kind: ConfigMap
metadata: { name: rip-config }
data:
  ENVIRONMENT: production
  VECTOR_BACKEND: pgvector
  CORS_ORIGINS: https://rip.example.com
  MCP_URL: http://rip-mcp:8765/mcp
  AI_PROVIDER: qwen
  AI_MODEL: Qwen/Qwen2.5-72B-Instruct
  QWEN_BASE_URL: http://vllm-qwen.inference:8000/v1
  LLAMA_BASE_URL: http://vllm-llama.inference:8000/v1
  EMBEDDING_PROVIDER: openai_compatible
  EMBEDDING_MODEL: BAAI/bge-m3
  EMBEDDING_BASE_URL: http://tei-bge-m3.inference:80/v1
  EMBEDDING_DIM: "1024"
  STORAGE_BACKEND: s3
  FILE_SCANNER: clamav
  LOG_LEVEL: INFO
---
# Secrets are synced from the cloud secret manager by External Secrets Operator (never committed).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: rip-secrets }
spec:
  refreshInterval: 1h
  secretStoreRef: { name: cloud-secret-store, kind: ClusterSecretStore }
  target: { name: rip-secrets }
  dataFrom: [{ extract: { key: rip/production } }]   # DATABASE_URL, REDIS_URL, JWT_SECRET, S3_BUCKET, *_API_KEY
