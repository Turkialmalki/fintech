apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rip-api }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rip-api }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: rip-web }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: rip-web }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
