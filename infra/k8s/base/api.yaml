apiVersion: apps/v1
kind: Deployment
metadata: { name: rip-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: rip-api } }
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  template:
    metadata: { labels: { app: rip-api } }
    spec:
      serviceAccountName: rip-api   # bound to a cloud IAM role (IRSA / Workload Identity) for S3 + secrets
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints: [{ maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: rip-api } } }]
      containers:
        - name: api
          image: ghcr.io/your-org/rip-api:latest
          ports: [{ containerPort: 8000, name: http }]
          envFrom: [{ configMapRef: { name: rip-config } }, { secretRef: { name: rip-secrets } }]
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, failureThreshold: 3 }
          startupProbe: { httpGet: { path: /healthz, port: http }, failureThreshold: 30, periodSeconds: 2 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }, { name: storage, mountPath: /data/storage }]
      volumes: [{ name: tmp, emptyDir: {} }, { name: storage, emptyDir: {} }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: rip-api }
---
apiVersion: v1
kind: Service
metadata: { name: rip-api }
spec: { selector: { app: rip-api }, ports: [{ port: 8000, targetPort: http, name: http }] }
