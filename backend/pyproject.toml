[project]
name = "rip-backend"
version = "1.0.0"
description = "Saudi Fintech Regulatory Intelligence Platform — API, RAG, agents, MCP server"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel's Python builder installs from this list).
dependencies = [
    "fastapi==0.121.3",
    "uvicorn[standard]==0.54.0",
    "SQLAlchemy==2.0.57",
    "alembic==1.20.1",
    "psycopg[binary]==3.3.8",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "email-validator==2.3.0",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
    "redis==8.1.0",
    "httpx==0.28.1",
    "langgraph==1.2.20",
    "langchain-core==1.7.6",
    "mcp==2.3.0",
    "numpy==2.5.4",
    "pypdf==7.0.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.33",
    "reportlab==5.1.0",
    "arabic-reshaper==3.1.0",
    "python-bidi==0.6.12",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.14.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py312"
