name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: rip, POSTGRES_PASSWORD: rip, POSTGRES_DB: rip_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rip" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://rip:rip@localhost:5432/rip_test
      VECTOR_BACKEND: pgvector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/rip_mcp --select E9,F63,F7,F82
      - run: pytest -q
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" .env
      - run: docker compose up -d --build --wait api mcp web
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pytest playwright==1.57.0 && playwright install --with-deps chromium
      - run: pytest -q e2e
      - if: failure()
        run: docker compose logs --tail 200

  security:
    runs-on: ubuntu-latest
    permissions: { contents: read, security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with: { scan-type: fs, scanners: "vuln,secret,misconfig", severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt

  images:
    if: github.ref == 'refs/heads/main'
    needs: [e2e, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write }
    strategy:
      matrix:
        include:
          - { name: rip-api, dockerfile: backend/Dockerfile }
          - { name: rip-mcp, dockerfile: mcp_server/Dockerfile }
          - { name: rip-web, dockerfile: frontend/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          provenance: true
          sbom: true
